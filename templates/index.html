<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieScraper - Discover Your Next Favorite Movie</title>
    <link
      href="{{ url_for('static', filename='css/style.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <nav class="nav">
          <a href="/" class="logo">MovieScraper</a>
          <ul class="nav-links">
            <li><a href="/" class="nav-link active">Home</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        <section class="hero">
          <h1>Discover Your Next Favorite Movie</h1>
          <p>
            Get personalized movie recommendations based on films you love. Our
            ML-powered system analyzes genres, actors, ratings, and plots to
            find perfect matches.
          </p>
        </section>

        <section class="search-section">
          <form action="/recommender" class="search-form" method="GET">
            <input
              type="text"
              name="movie"
              id="movie"
              class="search-input"
              placeholder="Enter a movie title (e.g., Whiplash, Inception)"
              required
              aria-label="Movie title to search for"
              autocomplete="off"
            />
            <button type="submit" class="search-button">Find Movies</button>
          </form>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p class="text-center">Made for movie lovers everywhere</p>
      </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
